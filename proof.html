<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>the proof — real artists, real results — jagger</title>
  <meta name="description" content="real artists who let me run their songs, in their own words. no bots, no fake numbers, just what happened.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#1a1a1a; --ink-soft:#444; --line:#d8d8d8; --paper:#fdfdfb; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      color:var(--ink); font-family:'Patrick Hand',cursive; font-size:1.25rem; line-height:32px;
      background-color:var(--paper);
      background-image:
        linear-gradient(to right, transparent 54px, #c9c9c9 54px, #c9c9c9 56px, transparent 56px),
        repeating-linear-gradient(var(--paper) 0px, var(--paper) 31px, var(--line) 31px, var(--line) 32px);
      background-attachment:local;
    }
    .page { max-width:680px; margin:0 auto; padding:64px 28px 96px 84px; }
    @media (max-width:700px){ body{ background-image:repeating-linear-gradient(var(--paper) 0px,var(--paper) 31px,var(--line) 31px,var(--line) 32px);} .page{ padding:48px 22px 80px 22px; } }
    h1 { font-family:'Caveat',cursive; font-weight:700; font-size:3.2rem; line-height:1.1; margin-bottom:8px; }
    .squiggle { display:block; width:240px; max-width:60%; height:14px; margin:-4px 0 26px; }
    .squiggle path { stroke:var(--ink); stroke-width:2.5; fill:none; stroke-linecap:round; }
    p { margin-bottom:32px; }
    p.soft { color:var(--ink-soft); }
    .u { text-decoration:underline wavy 1.5px; text-underline-offset:5px; }

    /* a testimonial = a taped index card */
    .card {
      position:relative; background:#fff; border:2.5px solid var(--ink);
      border-radius:15px 225px 15px 255px / 255px 15px 225px 15px;
      padding:26px 28px 22px; margin:44px 0;
      box-shadow:3px 4px 0 rgba(26,26,26,0.7);
    }
    .card:nth-child(even){ border-radius:255px 15px 225px 15px / 15px 225px 15px 255px; transform:rotate(-0.6deg); }
    .card:nth-child(odd){ transform:rotate(0.5deg); }
    .card::before {
      content:''; position:absolute; top:-14px; left:50%; transform:translateX(-50%) rotate(-3deg);
      width:120px; height:26px; background:rgba(180,180,180,0.38);
      border-left:1px dashed #999; border-right:1px dashed #999;
    }
    .quote { font-size:1.35rem; margin-bottom:14px; }
    .who { font-family:'Caveat',cursive; font-weight:700; font-size:1.5rem; }
    .who .handle { color:var(--ink-soft); font-weight:500; font-size:1.2rem; }
    .stat { display:inline-block; font-family:'Caveat',cursive; font-weight:700; font-size:1.3rem;
      border-bottom:2.5px solid var(--ink); margin-top:6px; }

    .cta { margin-top:64px; }
    .paybtn {
      display:inline-block; text-decoration:none;
      font-family:'Caveat',cursive; font-size:2.1rem; font-weight:700; color:#fff;
      background:var(--ink); border:3px solid var(--ink);
      border-radius:225px 18px 255px 18px / 18px 255px 18px 225px;
      padding:14px 44px; margin-top:8px; box-shadow:5px 6px 0 rgba(26,26,26,0.4);
    }
    footer { margin-top:72px; color:var(--ink-soft); font-size:1.05rem; }
    a { color:var(--ink); }
    .home { font-family:'Caveat',cursive; font-size:1.4rem; }
  </style>
</head>
<body>
  <div class="page">
    <h1>the proof.</h1>
    <svg class="squiggle" viewBox="0 0 220 14"><path d="M3 8 C 20 2, 35 12, 55 7 S 95 2, 115 8 S 160 13, 180 6 S 210 4, 217 8"/></svg>

    <p>real artists who let me run their songs, in their own words. no paid reviews, no bots, no made-up numbers. just what actually happened.</p>

      <p class="quote">"their quote goes here."</p>
      <p class="who">artist name <span class="handle">@handle</span></p>
      <span class="stat">optional result line (eg. 5,000 reached, 40 new saves)</span>
    </div>
    -->

    <div class="cta">
      <p>want your song on my pages next?</p>
      <a class="paybtn" href="https://jagger.soundlift.club/#pay">run my song →</a>
    </div>

    <p class="home" style="margin-top:56px;"><a href="https://jagger.soundlift.club">← back to the main page</a></p>

    <footer>
      <p style="margin-bottom:0;">- Jagger The Music Guy · <a href="mailto:jaggerman068@gmail.com">jaggerman068@gmail.com</a></p>
    </footer>
  </div>
</body>
</html>
